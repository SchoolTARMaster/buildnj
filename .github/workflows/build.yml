name: Build Node.js Portable (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clear the host disk (Crucial for Node.js build)
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Step 2: Use native Docker command to avoid the 'access denied' bug
      - name: Build in AlmaLinux 8
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace almalinux:8 bash -c "
            # 1. Setup Environment
            dnf install -y epel-release
            dnf install -y gcc-toolset-13 make libatomic python3.11 python3.11-devel git xz binutils
            alternatives --set python3 /usr/bin/python3.11
            source /opt/rh/gcc-toolset-13/enable
            
            # 2. Clone Main Branch
            git clone --branch main --depth 1 https://github.com/nodejs/node.git node-src
            cd node-src
            
            # 3. Configure & Build
            export LDFLAGS='-static-libstdc++ -static-libgcc'
            ./configure --experimental-quic --prefix=/
            make -j\$(nproc)
            
            # 4. Stage and Flatten
            mkdir -p /workspace/final
            make install DESTDIR=/workspace/staging
            mv /workspace/staging/usr/local/* /workspace/final/
            
            # 5. Shrink & Cleanup
            strip /workspace/final/bin/node
            rm -rf /workspace/final/share/man
            
            # 6. Create Tarball
            cd /workspace/final
            tar -czvf /workspace/node-v26-portable.tar.gz .
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-v26-linux-x64
          path: node-v26-portable.tar.gz
