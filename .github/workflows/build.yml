name: Build Node.js Main (QUIC/HTTP3 - Auto-Find)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build in AlmaLinux 8
        run: |
          docker run --rm -v ${{ github.workspace }}:/work almalinux:8 bash -c "
            # 1. Setup Environment
            dnf install -y epel-release
            dnf install -y gcc-toolset-13 make libatomic python3.11 python3.11-devel git xz binutils
            alternatives --set python3 /usr/bin/python3.11
            source /opt/rh/gcc-toolset-13/enable
            
            # 2. Clone Main Branch
            git clone --branch v26.8.1 --depth 1 https://github.com/nodejs/node.git node-src
            cd node-src
            
            # 3. Configure & Build
            export LDFLAGS='-static-libstdc++ -static-libgcc'
            ./configure --experimental-quic --prefix=/
            make -j\$(nproc)
            
            # 4. Staging
            mkdir -p /work/staging
            make install DESTDIR=/work/staging
            
            # 5. Search and Rescue Logic
            echo 'Searching for the node binary...'
            NODE_PATH=\$(find /work/staging -name node -type f -executable | grep 'bin/node' | head -n 1)
            
            if [ -z \"\$NODE_PATH\" ]; then
              echo 'ERROR: Could not find node binary anywhere in /work/staging!'
              exit 1
            fi
            
            # Get the parent directory of 'bin/node' (the actual root of the install)
            INSTALL_ROOT=\$(dirname \$(dirname \"\$NODE_PATH\"))
            echo \"Found install root at: \$INSTALL_ROOT\"
            
            # 6. Shrink & Cleanup
            strip \"\$NODE_PATH\"
            
            # 7. Create Tarball from the discovered root
            cd \"\$INSTALL_ROOT\"
            echo 'Contents to be tarred:'
            ls -R .
            tar -cvzf /work/node-main-linux-x64.tar.gz .
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-main-http3
          path: ${{ github.workspace }}/node-main-linux-x64.tar.gz
          if-no-files-found: error
